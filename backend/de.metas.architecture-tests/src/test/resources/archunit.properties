# ArchUnit configuration for the per-module architecture-tests aggregator.
#
# allowStoreCreation=true: the first time a module's rule has no committed baseline, ArchUnit records its
# current violations into ./archunit_store (committed to git) instead of failing. On later runs it reports only
# NEW violations as failures and prunes fixed ones. This is what lets per-module coverage grow incrementally:
# a module with no committed baseline auto-records and passes, rather than red-failing CI. Note: a newly-tracked
# module's pre-existing violations are auto-baselined on its first CI run (not immediately gating) — only NEW
# violations added after that first run fail.
freeze.store.default.allowStoreCreation=true
#
# failOnEmptyShould=false: the rules are evaluated per module (one module's classes at a time). Many modules
# legitimately contain no class matching a given rule's .that(...) scope (e.g. a util module with no
# @Service/@Component/@Repository/*BL class for the Env rule). Without this, ArchUnit treats "checked zero
# classes" as a failure — which is meaningless per module. A real new violation in a scoped class still fails.
archRule.failOnEmptyShould=false
