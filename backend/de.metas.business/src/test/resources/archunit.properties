# ArchUnit configuration for de.metas.business.
# allowStoreCreation=true: the first run (no store) records the legacy baseline into ./archunit_store
# (committed to git). On later runs ArchUnit reports NEW violations as failures and prunes fixed ones from
# the store. Pay down legacy debt by fixing a violation and re-running (the store entry is removed).
freeze.store.default.allowStoreCreation=true
