
info.app.name=metasfresh-app
info.app.title=metasfresh backend service

server.port=8282

# Spring Boot 3.5 ships BOTH the deprecated
# org.springframework.boot.autoconfigure.web.reactive.function.client.ClientHttpConnectorAutoConfiguration
# and the new ...http.client.reactive.ClientHttpConnectorAutoConfiguration. They register the same bean name,
# so the boot first failed with BeanDefinitionOverrideException. Merely allowing override is NOT enough: the
# new class's reactorResourceFactoryClientHttpConnectorBuilderCustomizer @Bean then receives an instance of
# the deprecated class -> IllegalArgumentException "not an instance of". So EXCLUDE the deprecated
# auto-configuration (only the new one stays active); keep allow-bean-definition-overriding as a safety net
# for any other duplicate-name beans surfaced by Spring Boot 3.
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.web.reactive.function.client.ClientHttpConnectorAutoConfiguration

# RabbitMQ
# avoid order problems with multithreading and channel size default 25
spring.rabbitmq.cache.channel.size=1

# because of infrastructure-reasons it's currently not easy to make the actuator available on /actuator/info
# thx to https://www.allprogrammingtutorials.com/tutorials/mapping-boot-endpoints-to-custom-path.php on how to change it back to the way it was with spring-boot-1
# also see https://github.com/metasfresh/metasfresh/issues/10969
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=*