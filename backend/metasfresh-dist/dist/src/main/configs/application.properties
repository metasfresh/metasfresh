
info.app.name=metasfresh-app
info.app.title=metasfresh backend service

server.port=8282

# Spring Boot 3.5 ships both the deprecated
# org.springframework.boot.autoconfigure.web.reactive.function.client.ClientHttpConnectorAutoConfiguration
# and the new ...http.client.reactive.ClientHttpConnectorAutoConfiguration; both register a bean named
# "clientHttpConnectorAutoConfiguration.ReactorNetty", which fails the boot under Spring Boot 3's default
# allow-bean-definition-overriding=false (BeanDefinitionOverrideException -> APPLICATION FAILED TO START).
spring.main.allow-bean-definition-overriding=true
