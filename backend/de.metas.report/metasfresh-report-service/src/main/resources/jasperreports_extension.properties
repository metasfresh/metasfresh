# JasperReports font extension for the metasfresh invoice report family.
#
# Registers Arial, SansSerif and OCRB font families with pdfEmbedded=true,
# which is required for PDF/A-3 compliance (ZUGFeRD e-invoicing).
#
# Arial and SansSerif are mapped to Liberation Sans (SIL Open Font License 1.1),
# which is metrics-compatible with Arial and legally embeddable.
# OCRB is mapped to the OCR-B TTF (GPL v2+), overriding the pdfEmbedded=false
# registration from the jp.osdn.ocrb jar.
net.sf.jasperreports.extension.registry.factory.fonts=net.sf.jasperreports.engine.fonts.SimpleFontExtensionsRegistryFactory
net.sf.jasperreports.extension.simple.font.families.metas.invoice=fonts/invoice/fontsfamily-invoice.xml
