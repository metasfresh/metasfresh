# Flaky-metric extractor — me03#30024.
#
# Runs after every cicd run on new_dawn_uat completes, extracts that run's test
# failures, classifies them by root-cause bucket, and upserts the result into
# the flakyness-metric Google Sheet. Also runs nightly as a backfill safety net.
#
# PLACEMENT: this file goes in metasfresh/metasfresh `.github/workflows/`
# (cicd.yaml lives there too, so `workflow_run` can observe it). The supporting
# node project (lib/, scripts/, package.json) must be checked into the same repo
# — proposed path: `.github/flaky-metric/`. See SETUP.md for the placement
# decision (metasfresh vs me03-gh-automation) which is still open.
#
# REQUIRED REPO SECRET (human-only, see SETUP.md):
#   GOOGLE_SHEETS_CREDENTIALS_JSON — the full service-account JSON, as a secret.
# REQUIRED REPO VARIABLE (or hardcode below):
#   FLAKY_SHEET_ID — the target spreadsheet id.

name: flaky-metric

on:
  workflow_run:
    workflows: ["cicd"]
    types: [completed]
    branches: [new_dawn_uat]
  schedule:
    - cron: "0 3 * * *" # nightly backfill of the last 2 days, in case a run was missed
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill window (e.g. 7d or 2026-05-25)"
        required: false
        default: "2d"

concurrency:
  group: flaky-metric
  cancel-in-progress: false # never drop an update; serialise instead

jobs:
  extract:
    runs-on: ubuntu-latest
    # Skip the per-run trigger for runs that didn't actually finish.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: .github/flaky-metric
        run: npm ci || npm install --no-audit --no-fund

      - name: Extract + upsert
        working-directory: .github/flaky-metric
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SHEETS_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}
          FLAKY_SHEET_ID: ${{ vars.FLAKY_SHEET_ID }}
          FLAKY_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            node scripts/extract.js --run "${{ github.event.workflow_run.id }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/extract.js --since "${{ github.event.inputs.since }}"
          else
            node scripts/extract.js --since 2d
          fi
