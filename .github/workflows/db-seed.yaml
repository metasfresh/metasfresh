# Builds the DB seed that docker-builds/Dockerfile.db-init restores, from a green new_dawn_uat preloaded DB image.
#
# The seed is a pg_dump of metasfresh/metas-db:<source-tag>-preloaded (the migrations of that run already applied),
# shipped as metasfresh/metas-db:<source-tag>-seed: a scratch image holding /metasfresh.pgdump. Dockerfile.db-init
# copies the dump from it, so the db-apply-migrations job of cicd only applies the scripts newer than the seed.
# Run it, then point Dockerfile.db-init at the new -seed tag in a PR.

name: db-seed

on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: "metas-db tag of a green new_dawn_uat push run, without the -preloaded suffix (e.g. 5.175-new-dawn-uat.45490)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  seed:
    if: ${{ github.repository == 'metasfresh/metasfresh' }}
    runs-on: ${{ vars.RUNNER_LIGHT }}
    env:
      SOURCE_IMAGE: metasfresh/metas-db:${{ inputs.source-tag }}-preloaded
      SEED_IMAGE: metasfresh/metas-db:${{ inputs.source-tag }}-seed
    steps:
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}

      - name: dump the preloaded DB
        run: |
          docker run -d --name seed-source "${SOURCE_IMAGE}"
          for i in $(seq 1 120); do
            docker exec seed-source pg_isready -q -U postgres -d metasfresh && break
            sleep 5
          done
          echo "DBVersion: $(docker exec -u postgres seed-source psql -d metasfresh -tAc 'select DBVersion from AD_System')"
          echo "migration scripts: $(docker exec -u postgres seed-source psql -d metasfresh -tAc 'select count(*) from AD_MigrationScript')"
          docker exec -u postgres seed-source pg_dump -Fc -d metasfresh -f /tmp/metasfresh.pgdump
          docker cp seed-source:/tmp/metasfresh.pgdump metasfresh.pgdump
          docker rm -f seed-source
          ls -l metasfresh.pgdump

      - name: build and push the seed image
        run: |
          printf 'FROM scratch\nCOPY metasfresh.pgdump /metasfresh.pgdump\n' > Dockerfile.seed
          docker build --file Dockerfile.seed --tag "${SEED_IMAGE}" .
          docker push "${SEED_IMAGE}"
          {
            echo "#### seed image"
            echo "* \`${SEED_IMAGE}\` (from \`${SOURCE_IMAGE}\`)"
            echo "* in docker-builds/Dockerfile.db-init: \`COPY --from=${SEED_IMAGE} --chown=postgres /metasfresh.pgdump metasfresh.pgdump\`"
          } >> "$GITHUB_STEP_SUMMARY"
