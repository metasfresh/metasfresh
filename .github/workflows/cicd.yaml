name: cicd
on: [push, workflow_dispatch]
permissions:
  contents: read
  packages: read

env:
  PIPELINE_VERSION: '0.4.1'
jobs:

  init:
    runs-on: ubuntu-latest
    outputs:
      tag-floating: ${{ steps.build-info-properties.outputs.mfversion }}-${{ steps.sanitize.outputs.refname }}
      tag-fixed: ${{ steps.build-info-properties.outputs.mfversion }}-${{ steps.sanitize.outputs.refname }}.${{ github.run_number }}
      build-info-properties: ${{ steps.build-info-properties.outputs.content }}
      git-properties: ${{ steps.git-properties.outputs.content }}
      base-version-matrix: ${{ steps.base-version-matrix.outputs.matrix }}
      branch-sanitized-gh-pages: ${{ steps.sanitize-branch-gh-pages.outputs.value }}
      skip-publish-reports: ${{ steps.skip-checks.outputs.skip-publish-reports }}
    steps:
      - name: Determine skip flags
        id: skip-checks
        run: |
          # Skip publish-reports for tmp-mergify/ branches only
          if [[ "${{ github.ref_name }}" == tmp-mergify/* ]]; then
            echo "skip-publish-reports=true" >> $GITHUB_OUTPUT
          else
            echo "skip-publish-reports=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v6
      - name: sanitize-ref-name
        id: sanitize
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          echo "refname=$(echo ""$GIT_REF"" | sed -r 's/([^a-zA-Z0-9.]+)/-/g' | sed -r 's/(^-|-$)//g')" >> $GITHUB_OUTPUT
      - name: sanitize-branch-for-gh-pages
        id: sanitize-branch-gh-pages
        env:
          GIT_REF: ${{ github.ref_name }}
        run: |
          SANITIZED=$(echo "$GIT_REF" | tr '/' '-' | tr '_' '-' | tr -cd 'a-zA-Z0-9.-' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/^-*//' | sed 's/-*$//')
          echo "value=${SANITIZED}" >> $GITHUB_OUTPUT
      - name: define-build-info-properties
        id: build-info-properties
        env:
          BUILD_SYSTEM: ${{ runner.name }}
          BUILD_USER: ${{ github.actor }}
        run: |
          echo "content=build.name=github actions\nbuild.system=$BUILD_SYSTEM\nbuild.time=$(date)\nbuild.user=$BUILD_USER\nbuild.version=$(cat docker-builds/version.info).3-${{ steps.sanitize.outputs.refname }}.${{ github.run_number }}\nbuild.number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "mfversion=$(cat docker-builds/version.info)" >> $GITHUB_OUTPUT
      - name: define-git-properties
        id: git-properties
        env:
          GIT_URL: ${{ github.repositoryUrl }}
          GIT_REF: ${{ github.ref }}
          GIT_ID: ${{ github.sha }}
        run: |
          echo "content=git.remote.origin.url=$GIT_URL\ngit.branch=$GIT_REF\ngit.commit.id=$GIT_ID\ngit.commit.message=$(git show -s --format=%s $GIT_ID)" >> $GITHUB_OUTPUT
      # - name: set-base-version-matrix
      #   id: base-version-matrix
      #   env:
      #     MF_PROJECT: ${{ fromJson(vars.PROJECT_MAP)[github.ref_name] }}
      #     BASE_VERSION_MATRIX: |
      #       ${{
      #         fromJson(vars.PROJECT_MAP)[github.ref_name] != ''
      #         && format('{{ "include": [{{ "project": "{0}", "branch": "{1}" }}] }}', fromJson(vars.PROJECT_MAP)[github.ref_name], github.ref_name)
      #         || ''
      #       }}
      #   run: |
      #     echo "matrix=$BASE_VERSION_MATRIX" >> $GITHUB_OUTPUT
      - name: print-vars
        run: env
      - name: print-info
        env:
          OUT_REFNAME: ${{ steps.sanitize.outputs.refname }}
          OUT_BUILD_PROPS: ${{ steps.build-info-properties.outputs.content }}
          OUT_GIT_PROPS: ${{ steps.git-properties.outputs.content }}
        run: |
          echo -e "[sanitized refname]\n$OUT_REFNAME\n"
          echo -e "[build-info.properties]\n$OUT_BUILD_PROPS\n"
          echo -e "[git-properties]\n$OUT_GIT_PROPS\n"
          echo "#### pipeline ($PIPELINE_VERSION)" >> $GITHUB_STEP_SUMMARY
          echo '* find more information at https://github.com/metasfresh/metasfresh/tree/${{ github.ref_name }}/docker-builds/README.md' >> $GITHUB_STEP_SUMMARY
          echo '* artifacts will be created for tag `${{ steps.build-info-properties.outputs.mfversion }}-${{ steps.sanitize.outputs.refname }}.${{ github.run_number }}`' >> $GITHUB_STEP_SUMMARY
          echo '* BASE_VERSION for instances **without** customisations will be `${{ steps.build-info-properties.outputs.mfversion }}-${{ steps.sanitize.outputs.refname }}.${{ github.run_number }}-compat`' >> $GITHUB_STEP_SUMMARY
          echo '* Allure test reports: https://test-reports.metasfresh.com/branches/${{ steps.sanitize-branch-gh-pages.outputs.value }}/builds/${{ steps.build-info-properties.outputs.mfversion }}-${{ steps.sanitize.outputs.refname }}.${{ github.run_number }}/allure/' >> $GITHUB_STEP_SUMMARY

  java:
    runs-on: ubuntu-latest
    needs: init
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare-settings
        env:
          METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
        run: |
          envsubst < docker-builds/mvn/settings.xml > docker-builds/mvn/local-settings.xml
      - name: build-commons
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.common \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-mvn-common:${{ needs.init.outputs.tag-floating }} \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --tag ghcr.io/metasfresh/metas-mvn-common:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-common:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-backend
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-floating }} \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --build-arg REFNAME=${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-backend-dist
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend.dist \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-floating }} \
          --build-arg VERSION=${{ needs.init.outputs.tag-fixed }} \
          --tag ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: extract-swingui-zip
        run: |
          CONTAINER_ID=$(docker create ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-floating }})
          docker cp "$CONTAINER_ID:/backend/metasfresh-dist/swingui/target/metasfresh-dist-swingui-10.0.0-client.zip" "metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}.zip"
          docker rm "$CONTAINER_ID"
          ls -lh metasfresh-swingui-*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}
          path: metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}.zip
          retention-days: 90
      - name: build-camel
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.camel \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-mvn-camel:${{ needs.init.outputs.tag-floating }} \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --build-arg REFNAME=${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-camel:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-camel:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-camel-dist
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.camel.dist \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-floating }} \
          --build-arg VERSION=${{ needs.init.outputs.tag-fixed }} \
          --tag ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push ghcr.io/metasfresh/metas-mvn-common:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-mvn-common:${{ needs.init.outputs.tag-floating }}
            docker push ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-floating }}
            docker push ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-floating }}
            docker push ghcr.io/metasfresh/metas-mvn-camel:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-mvn-camel:${{ needs.init.outputs.tag-floating }}
            docker push ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-floating }}
      - name: push-maven-dists
        run: |
          docker run --rm --env GITHUB_ACTOR=${{ github.actor }} --env GITHUB_TOKEN=${{ github.token }} ghcr.io/metasfresh/metas-mvn-backend-dist:${{ needs.init.outputs.tag-fixed }}
          docker run --rm --env GITHUB_ACTOR=${{ github.actor }} --env GITHUB_TOKEN=${{ github.token }} ghcr.io/metasfresh/metas-mvn-camel-dist:${{ needs.init.outputs.tag-fixed }}

  frontend:
    runs-on: ubuntu-latest
    needs: init
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build-frontend
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.frontend \
          --cache-to type=inline \
          --cache-from metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-mobile
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.mobile \
          --cache-to type=inline \
          --cache-from metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-mobile:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-mobile:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }}
      - name: produce-summary
        run: |
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-mobile:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY

  test-frontend:
    name: test (frontend)
    runs-on: ubuntu-latest
    needs: [init, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: run-tests
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.frontend \
          --target test \
          --tag metas-frontend:test \
          .
      - name: extract results
        run: |
          docker run --rm --volume "$(pwd)/jest:/reports" metas-frontend:test                                       # extracting test results from docker image
      - name: assert success
        run: |
          if [ $(cat jest/frontend/jest.exit-code) != 0 ]; then tail -1000 jest/frontend/jest.log && exit 1; fi     # print frontend log and exit if frontend failed
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: jest-logs
          path: jest/**/jest.log

  backend:
    runs-on: ubuntu-latest
    needs: [init, java]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare
        env:
          INIT_BUILD_PROPS: ${{ needs.init.outputs.build-info-properties }}
          INIT_GIT_PROPS: ${{ needs.init.outputs.git-properties }}
        run: |
          echo -e "$INIT_BUILD_PROPS" > docker-builds/metadata/build-info.properties
          echo -e "$INIT_GIT_PROPS" > docker-builds/metadata/git.properties
      - name: build-api
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend.api \
          --cache-to type=inline \
          --cache-from metasfresh/metas-api:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-api:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-app
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend.app \
          --cache-to type=inline \
          --cache-from metasfresh/metas-app:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-app:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-externalsystems
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.camel.externalsystems \
          --cache-to type=inline \
          --cache-from metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-edi
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.camel.edi \
          --cache-to type=inline \
          --cache-from metasfresh/metas-edi:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-edi:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-edi:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-db
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.db-init \
          --cache-to type=inline \
          --cache-from metasfresh/metas-db:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-db:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-api:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-app:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-db:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-edi:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-edi:${{ needs.init.outputs.tag-floating }}
      - name: extract-swingui
        run: |
          docker cp "$(docker create --name swingui-extract metasfresh/metas-mvn-backend:${{ needs.init.outputs.tag-fixed }}):/backend/metasfresh-dist/swingui/target/metasfresh-dist-swingui-10.0.0-client.zip" ./metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}.zip && docker rm swingui-extract
          ls -la metasfresh-swingui-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}
          path: metasfresh-swingui-${{ needs.init.outputs.tag-fixed }}.zip
      - name: disk-cleanup
        run: |
          docker system prune -af --filter "until=1h"
          df -h
      - name: build-db-migration-tool
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.db-migration-tool \
          --cache-to type=inline \
          --cache-from metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-db-migration-tool
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-floating }}
      - name: produce-summary
        run: |
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-externalsystems:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-db-migration-tool:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-edi:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY

  procurement:
    runs-on: ubuntu-latest
    needs: [ init, java ]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare-settings
        env:
          METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
        run: |
          envsubst < docker-builds/mvn/settings.xml > docker-builds/mvn/local-settings.xml
      - name: build-procurement-backend
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.procurement.backend \
          --cache-to type=inline \
          --cache-from metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-floating }} \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --tag metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-procurement-nginx
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.procurement.nginx \
          --cache-to type=inline \
          --cache-from metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-procurement-rabbitmq
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.procurement.rabbitmq \
          --cache-to type=inline \
          --cache-from metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: build-procurement-frontend
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.procurement.frontend \
          --cache-to type=inline \
          --cache-from metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-floating }} \
          --tag metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-floating }}
            docker push metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-fixed }}
            docker push metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-floating }}
      - name: produce-summary
        run: |
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-procurement-backend:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-procurement-nginx:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-procurement-rabbitmq:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-procurement-frontend:${{ needs.init.outputs.tag-fixed }}' >> $GITHUB_STEP_SUMMARY
        

  preloaded-db:
    runs-on: ubuntu-latest
    needs: [init, backend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - name: build-db-preloaded
        env:
          mfregistry: metasfresh
          mfversion: ${{ needs.init.outputs.tag-fixed }}
        working-directory: docker-builds/db/init-preloaded
        run: |
          docker compose build db
          docker compose up -d db
          docker compose up migration --abort-on-container-exit --exit-code-from migration
          # Restart db for post-migration SQL (migration --abort-on-container-exit stops all)
          docker compose up -d db
          sleep 5
          # Open all period controls and create periods through 2030 (post-migration, avoids ID conflicts with migration scripts)
          docker compose exec -T db psql -U metasfresh -d metasfresh -c "UPDATE C_PeriodControl SET PeriodStatus='O', PeriodAction='O' WHERE PeriodStatus != 'O';"
          docker compose exec -T db psql -U metasfresh -d metasfresh -f - <<'DBEOF'
          DO $$
          DECLARE v_cal int; v_yid int; v_pid int; v_pcid int; v_yr int; v_mo int; v_sd date; v_ed date; v_dbt text;
          BEGIN
            SELECT C_Calendar_ID INTO v_cal FROM C_Calendar WHERE AD_Client_ID=1000000 AND IsActive='Y' ORDER BY C_Calendar_ID LIMIT 1;
            IF v_cal IS NULL THEN RETURN; END IF;
            FOR v_yr IN 2023..2030 LOOP
              SELECT C_Year_ID INTO v_yid FROM C_Year WHERE C_Calendar_ID=v_cal AND FiscalYear=v_yr::text;
              IF v_yid IS NULL THEN
                SELECT COALESCE(MAX(C_Year_ID),999999)+1 INTO v_yid FROM C_Year;
                INSERT INTO C_Year(C_Year_ID,AD_Client_ID,AD_Org_ID,C_Calendar_ID,FiscalYear,IsActive,Created,CreatedBy,Updated,UpdatedBy) VALUES(v_yid,1000000,0,v_cal,v_yr::text,'Y',now(),0,now(),0);
              END IF;
              FOR v_mo IN 1..12 LOOP
                v_sd:=make_date(v_yr,v_mo,1); v_ed:=(v_sd+interval '1 month'-interval '1 day')::date;
                SELECT C_Period_ID INTO v_pid FROM C_Period WHERE C_Year_ID=v_yid AND PeriodNo=v_mo;
                IF v_pid IS NULL THEN
                  SELECT COALESCE(MAX(C_Period_ID),999999)+1 INTO v_pid FROM C_Period;
                  INSERT INTO C_Period(C_Period_ID,AD_Client_ID,AD_Org_ID,C_Year_ID,PeriodNo,Name,StartDate,EndDate,PeriodType,IsActive,Created,CreatedBy,Updated,UpdatedBy) VALUES(v_pid,1000000,0,v_yid,v_mo,to_char(v_sd,'Mon')||'-'||to_char(v_sd,'YY'),v_sd,v_ed,'S','Y',now(),0,now(),0);
                  FOR v_dbt IN SELECT d FROM (VALUES('AVI'),('API'),('ARC'),('ARI'),('ARR'),('APP'),('CMC'),('DOO'),('GLD'),('GLJ'),('MCC'),('MMI'),('MMP'),('MMM'),('MMR'),('MMS'),('MXI'),('MXP'),('PJI'),('POO'),('SOO'),('HRP'),('FAI'),('FAD'),('FDP'),('MQI'),('MQP'))t(d) LOOP
                    SELECT COALESCE(MAX(C_PeriodControl_ID),999999)+1 INTO v_pcid FROM C_PeriodControl;
                    INSERT INTO C_PeriodControl(C_PeriodControl_ID,AD_Client_ID,AD_Org_ID,C_Period_ID,DocBaseType,PeriodStatus,PeriodAction,IsActive,Created,CreatedBy,Updated,UpdatedBy) VALUES(v_pcid,1000000,0,v_pid,v_dbt,'O','O','Y',now(),0,now(),0);
                  END LOOP;
                ELSE
                  UPDATE C_PeriodControl SET PeriodStatus='O',PeriodAction='O' WHERE C_Period_ID=v_pid AND PeriodStatus!='O';
                END IF;
              END LOOP;
            END LOOP;
          END$$;
          DBEOF
          docker commit "$(docker compose ps -q db)" metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-preloaded
          docker tag metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-preloaded metasfresh/metas-db:${{ needs.init.outputs.tag-floating }}-preloaded
          docker compose down
      - name: push-db-preloaded
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-preloaded
            docker push metasfresh/metas-db:${{ needs.init.outputs.tag-floating }}-preloaded
      - name: produce-summary
        run: |
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-preloaded' >> $GITHUB_STEP_SUMMARY

  compatibility-images:
    runs-on: ubuntu-latest
    needs: [init, frontend, backend, preloaded-db]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare
        env:
          INIT_BUILD_PROPS: ${{ needs.init.outputs.build-info-properties }}
          INIT_GIT_PROPS: ${{ needs.init.outputs.git-properties }}
        run: |
          echo -e "$INIT_BUILD_PROPS" > docker-builds/metadata/build-info.properties
          echo -e "$INIT_GIT_PROPS" > docker-builds/metadata/git.properties
      - name: build-api-compat
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend.api.compat \
          --cache-to type=inline \
          --cache-from metasfresh/metas-api:${{ needs.init.outputs.tag-floating }}-compat \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-api:${{ needs.init.outputs.tag-floating }}-compat \
          --tag metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }}-compat \
          .
      - name: build-app-compat
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.backend.app.compat \
          --cache-to type=inline \
          --cache-from metasfresh/metas-app:${{ needs.init.outputs.tag-floating }}-compat \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-app:${{ needs.init.outputs.tag-floating }}-compat \
          --tag metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }}-compat \
          .
      - name: build-mobile-compat
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.mobile.compat \
          --cache-to type=inline \
          --cache-from metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }}-compat \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }}-compat \
          --tag metasfresh/metas-mobile:${{ needs.init.outputs.tag-fixed }}-compat \
          .
      - name: build-frontend-compat
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.frontend.compat \
          --cache-to type=inline \
          --cache-from metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }}-compat \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }}-compat \
          --tag metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }}-compat \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metas-api:${{ needs.init.outputs.tag-floating }}-compat
            docker push metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metas-app:${{ needs.init.outputs.tag-floating }}-compat
            docker push metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metas-frontend:${{ needs.init.outputs.tag-floating }}-compat
            docker push metasfresh/metas-mobile:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metas-mobile:${{ needs.init.outputs.tag-floating }}-compat
            docker tag metasfresh/metas-api:${{ needs.init.outputs.tag-fixed }}-compat metasfresh/metasfresh-webapi:${{ needs.init.outputs.tag-fixed }}-compat
            docker tag metasfresh/metas-app:${{ needs.init.outputs.tag-fixed }}-compat metasfresh/metasfresh-app:${{ needs.init.outputs.tag-fixed }}-compat
            docker tag metasfresh/metas-frontend:${{ needs.init.outputs.tag-fixed }}-compat metasfresh/metasfresh-webui:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metasfresh-webapi:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metasfresh-app:${{ needs.init.outputs.tag-fixed }}-compat
            docker push metasfresh/metasfresh-webui:${{ needs.init.outputs.tag-fixed }}-compat
      - name: produce-summary
        run: |
          echo 'compatibility images are available under the following tag: `${{ needs.init.outputs.tag-fixed }}-compat`' >> $GITHUB_STEP_SUMMARY
          echo 'and can be deployed on any regular system via metasfresh instances rollout using the above tag as *Baseversion*.' >> $GITHUB_STEP_SUMMARY
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metasfresh-webapi:${{ needs.init.outputs.tag-fixed }}-compat' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metasfresh-app:${{ needs.init.outputs.tag-fixed }}-compat' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metasfresh-webui:${{ needs.init.outputs.tag-fixed }}-compat' >> $GITHUB_STEP_SUMMARY

  junit:
    name: test (java)
    runs-on: ubuntu-latest
    needs: [init, java]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare-settings
        env:
          METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
        run: |
          envsubst < docker-builds/mvn/settings.xml > docker-builds/mvn/local-settings.xml
      - name: run-junit-tests-j8
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.junit \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }} \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --build-arg SKIP_MIGRATION_SCRIPTS_TEST=true \
          --tag ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: run-junit-tests-j14
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.camel.junit \
          --cache-to type=inline \
          --cache-from ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }}-j14 \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }}-j14 \
          --tag ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-fixed }}-j14 \
          .
      - name: push-result-image
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }}
            docker push ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-floating }}-j14
      - name: extract-results
        run: |
          docker run --rm --volume "$(pwd)/junit:/reports" ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-fixed }}           # extracting java8 test results from docker image
          docker run --rm --volume "$(pwd)/junit:/reports" ghcr.io/metasfresh/metas-junit:${{ needs.init.outputs.tag-fixed }}-j14       # extracting java14 test results from docker image
      - name: assert success
        run: |
          if [ $(cat junit/commons/junit.exit-code) != 0 ] || [ $(cat junit/commons/junit.mvn.exit-code) != 0 ]; then tail -1000 junit/commons/junit.log && exit 1; fi      # print commons log and exit if commons failed
          if [ $(cat junit/backend/junit.exit-code) != 0 ] || [ $(cat junit/backend/junit.mvn.exit-code) != 0 ]; then tail -1000 junit/backend/junit.log && exit 1; fi      # print backend log and exit if backend failed
          if [ $(cat junit/camel/junit.exit-code) != 0 ] || [ $(cat junit/camel/junit.mvn.exit-code) != 0 ]; then tail -1000 junit/camel/junit.log && exit 1; fi            # print camel log and exit if camel failed
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: junit-logs
          path: junit/**/junit.log

  cucumber-build:
    name: build (cucumber)
    runs-on: ubuntu-latest
    needs: [init, java]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare-settings
        env:
          METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
        run: |
          envsubst < docker-builds/mvn/settings.xml > docker-builds/mvn/local-settings.xml
      - name: build-cucumber
        run: |
          docker buildx build \
          --file docker-builds/Dockerfile.cucumber \
          --secret id=mvn-settings,src=docker-builds/mvn/local-settings.xml \
          --build-arg REFNAME=${{ needs.init.outputs.tag-fixed }} \
          --tag ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-floating }} \
          --tag ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }} \
          .
      - name: push-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }}
            docker push ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-floating }}
  cucumber-run:
    name: test (cucumber)
    runs-on: ubuntu-latest
    needs: [init, backend, frontend, cucumber-build, preloaded-db]
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
        profile: [profile1, profile2, catchall]
        include:
          - profile: profile1
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor1 and not @flaky and not @ignore"
          - profile: profile2
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor2 and not @flaky and not @ignore"
          - profile: profile3
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor3 and not @flaky and not @ignore"
          - profile: profile4
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor4 and not @flaky and not @ignore"
          - profile: profile5
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor5 and not @flaky and not @ignore"
          - profile: profile6
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor6 and not @flaky and not @ignore"
          - profile: profile7
            params: -Dcucumber.filter.tags="@ghActions:run_on_executor7 and not @flaky and not @ignore"
          - profile: flaky
            params: -Dcucumber.filter.tags="@ghActions:flaky and not @ignore"
          - profile: catchall
            params: -Dcucumber.filter.tags="not @ghActions:run_on_executor1 and not @ghActions:run_on_executor2 and not @ghActions:run_on_executor3 and not @ghActions:run_on_executor4 and not @ghActions:run_on_executor5 and not @ghActions:run_on_executor6 and not @ghActions:run_on_executor7 and not @ignore"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: run-tests
        env:
          mfversion: ${{ needs.init.outputs.tag-fixed }}
          cucumberparams: ${{ matrix.params }}
          # TEST_SMTP_* env vars are no longer set here: the cucumber compose
          # now starts a local MailPit container and the SMTP defaults in
          # docker-builds/cucumber/compose.yml point at it. The previous
          # external SMTP relay was rejecting the secrets-stored credentials
          # since 2026-05-21 (provider-side lockout), keeping profile4 red
          # across every branch. Removing the secrets reference also lets
          # forks and PR-from-fork builds run the SMTP scenario without
          # needing the org secrets.
        timeout-minutes: 120
        run: |
          mkdir cucumber
          docker pull ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }}
          docker cp "$(docker create --name tempcopytainer ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }}):/compose.yml" . && docker rm tempcopytainer
          # compose.yml references ${mfregistry:-metasfresh}/metas-cucumber (the Docker Hub name); the image
          # now lives on GHCR. Retag the pulled ghcr image under that name so compose uses the local image.
          docker tag ghcr.io/metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }} metasfresh/metas-cucumber:${{ needs.init.outputs.tag-fixed }}
          docker compose up --abort-on-container-exit --exit-code-from cucumber 2>&1 | tee cucumber.log && echo "${PIPESTATUS[0]}" > cucumber.exit-code
          docker commit metasfresh-db-1 metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-postcucumber-${{ matrix.profile }}
          docker compose down
          cat cucumber.log | grep -q "BUILD SUCCESS" && echo "$?" > cucumber.mvn.exit-code || echo "$?" > cucumber.mvn.exit-code
      - name: Extract Cucumber Allure results
        if: always()
        run: |
          echo "=== Searching for Allure results ==="
          mkdir -p cucumber-allure-results
          FOUND_RESULTS=false

          # Check primary location: cucumber/allure-results (entrypoint.sh copies target/allure-results here)
          if [ -d "cucumber/allure-results" ]; then
            echo "Found results in cucumber/allure-results"
            cp -r cucumber/allure-results/. cucumber-allure-results/
            FOUND_RESULTS=true
          # Check alternative location: cucumber/target/allure-results
          elif [ -d "cucumber/target/allure-results" ]; then
            echo "Found results in cucumber/target/allure-results"
            cp -r cucumber/target/allure-results/. cucumber-allure-results/
            FOUND_RESULTS=true
          else
            echo "Searching for allure-results directory..."
            ALLURE_DIR=$(find cucumber -name "allure-results" -type d 2>/dev/null | head -1)
            if [ -n "$ALLURE_DIR" ]; then
              echo "Found results in $ALLURE_DIR"
              cp -r "$ALLURE_DIR"/. cucumber-allure-results/
              FOUND_RESULTS=true
            fi
          fi

          if [ "$FOUND_RESULTS" = true ]; then
            # Add build metadata (branch/build only - executor.profile removed as confusing)
            echo "branch=${{ github.ref_name }}" >> cucumber-allure-results/environment.properties
            echo "build=${{ needs.init.outputs.tag-fixed }}" >> cucumber-allure-results/environment.properties

            # Report findings
            JSON_COUNT=$(find cucumber-allure-results -name '*.json' -type f | wc -l)
            echo "Allure results extracted: $JSON_COUNT JSON files for profile ${{ matrix.profile }}"
          else
            echo "No Allure results found for profile ${{ matrix.profile }}"
            echo "Available directories in cucumber/:"
            ls -la cucumber/ 2>/dev/null || echo "cucumber/ does not exist"
          fi
      - name: Upload Cucumber Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-allure-results-${{ matrix.profile }}
          path: cucumber-allure-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: push-database-images
        uses: nick-fields/retry@v4
        with:
          max_attempts: ${{ vars.RETRY_ATTEMPTS }}
          retry_wait_seconds: ${{ vars.RETRY_DELAY }}
          timeout_minutes: ${{ vars.RETRY_TIMEOUT }}
          command: |
            docker push metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-postcucumber-${{ matrix.profile }}                                                          # upload database image containing post cucumber test state
      - name: produce-summary
        run: |
          echo '#### images' >> $GITHUB_STEP_SUMMARY
          echo '* metasfresh/metas-db:${{ needs.init.outputs.tag-fixed }}-postcucumber-${{ matrix.profile }}' >> $GITHUB_STEP_SUMMARY
      - name: assert success
        run: |
          if [ $(cat cucumber.exit-code) != 0 ] || [ $(cat cucumber.mvn.exit-code) != 0 ]; then tail -1000 cucumber.log && exit 1; fi                                     # print cucumber log and exit if cucumber failed
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cucumber-logs
          path: cucumber.log
      # Allure results uploaded per-profile above; combined report built by cucumber-allure-report job

  cucumber-allure-report:
    name: Generate Cucumber Allure Report
    runs-on: ubuntu-latest
    needs: [ init, cucumber-run ]
    if: always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all Cucumber Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: cucumber-allure-results-*
          path: all-cucumber-results/
          merge-multiple: true

      - name: Check if results exist
        id: check_results
        run: |
          echo "=== Allure Results Diagnostics ==="
          if [ -d "all-cucumber-results" ] && [ "$(ls -A all-cucumber-results 2>/dev/null)" ]; then
            echo "has_results=true" >> $GITHUB_OUTPUT
            echo "Directory exists. File counts:"
            echo "  Total files: $(find all-cucumber-results -type f | wc -l)"
            echo "  JSON result files: $(find all-cucumber-results -name '*-result.json' -type f | wc -l)"
            echo "  Container files: $(find all-cucumber-results -name '*-container.json' -type f | wc -l)"
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
            echo "No Allure results found - skipping report generation"
            ls -la || true
          fi

      - name: Setup Allure
        if: steps.check_results.outputs.has_results == 'true'
        uses: ./.github/actions/setup-allure

      - name: Generate combined Allure report
        if: steps.check_results.outputs.has_results == 'true'
        uses: ./.github/actions/generate-allure-report
        with:
          results-dir: all-cucumber-results
          output-dir: cucumber-allure-report
          artifact-name: allure-report-cucumber
          retention-days: 30
          history-artifact-name: allure-history-cucumber
          report-title: 'Cucumber BDD'

      - name: Upload Cucumber Allure report to server
        if: steps.check_results.outputs.has_results == 'true'
        uses: ./.github/actions/upload-report-to-server
        with:
          report-dir: cucumber-allure-report
          report-type: allure/cucumber
          branch: ${{ needs.init.outputs.branch-sanitized-gh-pages }}
          version: ${{ needs.init.outputs.tag-fixed }}
          ssh-key: ${{ secrets.REPORTS_SERVER_SSH_KEY }}
          server-hostname: ${{ secrets.TESTREPORTS_HOSTNAME }}
          server-user: ${{ secrets.TESTREPORTS_USER }}
          server-ssh-port: ${{ secrets.TESTREPORTS_SSH_PORT }}
          storagebox-base-path: ${{ secrets.TESTREPORTS_BASE_PATH }}

  health_check:
    name: health check
    runs-on: ubuntu-latest
    needs: [ init, backend, frontend, preloaded-db ]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: metasfresh
          password: ${{ secrets.DOCKERHUB_METASFRESH_RW_TOKEN }}
      - uses: docker/login-action@v4
