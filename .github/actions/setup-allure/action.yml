name: 'Setup Allure CLI'
description: 'Install Allure command-line tool for report generation'
runs:
  using: 'composite'
  steps:
    - name: Install Allure CLI
      shell: bash
      run: |
        # Canonical (new_dawn_uat) reads the version from e2e/mobile-webui/package.json.
        # This branch has no e2e/mobile-webui npm project (its mobile test runs via
        # docker-builds/mobiletest/), so pin the same version that new_dawn_uat uses and
        # treat that package.json as an optional override if it ever exists.
        DEFAULT_ALLURE_VERSION="2.32.1"
        ALLURE_VERSION="$DEFAULT_ALLURE_VERSION"
        if [ -f e2e/mobile-webui/package.json ]; then
          FROM_PKG=$(jq -r '.devDependencies["allure-commandline"] // empty | sub("^\\^"; "")' e2e/mobile-webui/package.json)
          if [ -n "$FROM_PKG" ] && [ "$FROM_PKG" != "null" ]; then
            ALLURE_VERSION="$FROM_PKG"
          fi
        fi

        echo "Installing Allure CLI v${ALLURE_VERSION}..."
        wget -q "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" -O /tmp/allure.tgz
        sudo tar -xzf /tmp/allure.tgz -C /opt/
        sudo ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure
        allure --version
        echo "✓ Allure CLI installed successfully"
