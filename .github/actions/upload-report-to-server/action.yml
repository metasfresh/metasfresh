name: 'Upload Report to Server'
description: 'Upload an HTML test report to test-reports.metasfresh.com via SSH/rsync'

inputs:
  report-dir:
    description: 'Local directory containing the HTML report (must have index.html)'
    required: true
  report-type:
    description: 'Server subdirectory path, e.g. allure/cucumber or junit/backend'
    required: true
  branch:
    description: 'Sanitized branch name'
    required: true
  version:
    description: 'Build version tag'
    required: true
  ssh-key:
    description: 'SSH private key for authentication'
    required: true
  server-hostname:
    description: 'Storagebox hostname'
    required: true
  server-user:
    description: 'Storagebox SSH user'
    required: true
  server-ssh-port:
    description: 'Storagebox SSH port'
    required: true
  storagebox-base-path:
    description: 'Base path on storagebox filesystem'
    required: true

outputs:
  skip:
    description: 'Set to true if upload was skipped (missing key or report)'
    value: ${{ steps.check.outputs.skip }}

runs:
  using: 'composite'
  steps:
    - name: Check prerequisites
      id: check
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        if [ -z "$SSH_KEY" ]; then
          echo "::notice::Skipping report upload — ssh-key input is empty"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "$REPORT_DIR/index.html" ]; then
          echo "::notice::Skipping report upload — $REPORT_DIR/index.html does not exist"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Setup SSH
      if: steps.check.outputs.skip != 'true'
      uses: ./.github/actions/setup-reports-ssh
      with:
        ssh-key: ${{ inputs.ssh-key }}
        server-hostname: ${{ inputs.server-hostname }}
        server-user: ${{ inputs.server-user }}
        server-ssh-port: ${{ inputs.server-ssh-port }}

    # Publishing the report is best-effort: the test outcome is decided by the calling job's own
    # result/assert steps, never by this upload. Transient failures are retried with backoff; a
    # failure that persists (reports server down) is reported as a warning and does not turn a
    # green test job red.
    - name: Upload report
      if: steps.check.outputs.skip != 'true'
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        REPORT_TYPE: ${{ inputs.report-type }}
        BRANCH: ${{ inputs.branch }}
        VERSION: ${{ inputs.version }}
        STORAGEBOX_BASE_PATH: ${{ inputs.storagebox-base-path }}
      run: |
        STORAGEBOX_PATH="${STORAGEBOX_BASE_PATH}/branches/${BRANCH}/builds/${VERSION}/${REPORT_TYPE}"
        SERVER_PATH="/var/www/test-reports/branches/${BRANCH}/builds/${VERSION}/${REPORT_TYPE}"
        REPORT_URL="https://test-reports.metasfresh.com/branches/${BRANCH}/builds/${VERSION}/${REPORT_TYPE}/"

        # retry <description> <command...>: up to 3 attempts, 15 s then 30 s backoff
        retry() {
          local what="$1" attempt delay=15 rc
          shift
          for attempt in 1 2 3; do
            if "$@"; then return 0; else rc=$?; fi
            echo "${what} failed with exit code ${rc} (attempt ${attempt}/3)"
            if [ "$attempt" -lt 3 ]; then sleep "$delay"; delay=$((delay * 2)); fi
          done
          return "$rc"
        }

        echo "Creating server directory: $SERVER_PATH"
        if ! retry "Creating the server directory" ssh reports-server "mkdir -p '${SERVER_PATH}'"; then
          echo "::warning::Report ${REPORT_TYPE} was NOT published: the reports server could not be reached (test results are unaffected)"
          exit 0
        fi

        echo "Uploading report from ${REPORT_DIR}/ to reports-storage:${STORAGEBOX_PATH}/"
        if ! retry "Uploading the report" rsync -az --delete "${REPORT_DIR}/" "reports-storage:${STORAGEBOX_PATH}/"; then
          echo "::warning::Report ${REPORT_TYPE} was NOT published: the upload to the report storage failed (test results are unaffected)"
          exit 0
        fi

        echo "::notice::Report uploaded to ${REPORT_URL}"

    - name: Cleanup SSH key
      if: always() && steps.check.outputs.skip != 'true'
      shell: bash
      run: rm -f ~/.ssh/reports_key
